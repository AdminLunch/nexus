<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>NEXUS · Open Kompas (prototype)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <header class="top">
    <div class="brand">
      <span class="mini-compass" aria-hidden="true"><i></i></span>
      <div><b>NEXUS Kompas</b><small>prototype · alleen fictief · niets wordt bewaard</small></div>
    </div>
    <button class="ai-chip" id="ai-toggle" hidden>🔧 Lokaal</button>
    <button class="icon-round" id="btn-new-session" title="Nieuwe sessie met hetzelfde kompas" aria-label="Nieuwe sessie">↻</button>
  </header>

  <nav class="switch" role="tablist" aria-label="Weergave">
    <button role="tab" class="on" data-view="chat" aria-selected="true">💬 Gesprek</button>
    <button role="tab" data-view="kompas" aria-selected="false" id="tab-kompas">🧭 Mijn Kompas <span class="badge" id="kompas-count" hidden>0</span></button>
  </nav>

  <main class="stage">
    <section class="view chat-view on" data-view="chat" aria-label="Gesprek">
      <div id="ai-consent"></div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="context-actions" class="cards"></div>
      <div id="proposals" class="proposals"></div>
      <div id="core-actions" class="joystick" aria-label="Altijd beschikbaar"></div>
      <form id="composer" class="composer" autocomplete="off">
        <input id="input" class="input" placeholder="Vertel maar… of kies hierboven" aria-label="Bericht">
        <button class="send" type="submit" aria-label="Stuur">➤</button>
      </form>
    </section>

    <section class="view kompas-view" data-view="kompas" aria-label="Mijn Kompas">
      <div class="compass-wrap">
        <div class="compass" id="compass">
          <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
          <span class="dir n">N<small>belangrijk</small></span>
          <span class="dir e">O<small>nieuwsgierig</small></span>
          <span class="dir s">Z<small>verteld</small></span>
          <span class="dir w">W<small>inzichten</small></span>
          <div class="needle" aria-hidden="true"></div>
          <div class="core">jij</div>
          <div id="bubbles"></div>
        </div>
        <p class="hint" id="compass-hint"></p>
      </div>
      <div class="kompas-actions">
        <button class="pill" id="btn-add">＋ Zelf iets toevoegen</button>
        <button class="pill" id="btn-demo">🎭 Fictieve demo-persoon</button>
        <button class="pill danger" id="btn-wipe">🧹 Alles wissen</button>
      </div>
      <details class="drawer" id="archive"><summary>📦 Archief <span id="archive-count"></span></summary><div id="archive-list"></div></details>
      <details class="drawer" id="guard-panel"><summary>🛡️ Waarborgen &amp; AI-context (voor ontwikkelaars)</summary><div id="guard-info"></div></details>
    </section>
  </main>

  <div id="sheet-root"></div>
  <div id="dialog-root"></div>
  <div id="fx-root" aria-hidden="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
